name: OpenWrt packages

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: shellcheck + unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y shellcheck jq
      - name: shellcheck (bash scripts)
        run: shellcheck -x openwrt/cake-autorate/files/uci-to-config.sh openwrt/cake-autorate/files/migrate-legacy-config.sh openwrt/cake-autorate/files/defaults-to-json.sh
      - name: shellcheck (sh scripts)
        run: shellcheck -s sh -e SC1091 openwrt/cake-autorate/files/cake-autorate.init openwrt/cake-autorate/files/mqtt-publisher.init openwrt/cake-autorate/files/cake-autorate.defaults openwrt/cake-autorate/files/rpcd-cake-autorate
      - name: shellcheck (core)
        run: shellcheck -x cake-autorate.sh lib.sh -S warning
      - name: shellcheck (tests)
        run: shellcheck -x openwrt/tests/*.sh -S warning
      - name: node --check (LuCI JS)
        run: |
          for f in $(git ls-files 'openwrt/luci-app-cake-autorate/**/*.js'); do
            node --check "$f" || exit 1
          done
      - name: unit tests
        run: bash openwrt/tests/run-tests.sh

  build:
    name: build ${{ matrix.version }}
    needs: test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        version: ['24.10.0', '25.12.0']
    steps:
      - uses: actions/checkout@v4
      - name: Build with the OpenWrt SDK
        uses: openwrt/gh-action-sdk@f5813d30eeef3534b58ac7e79c5d8842b6035434 # main as of 2026-09-30
        env:
          ARCH: x86_64-${{ matrix.version }}
          FEEDNAME: cakeautorate
          PACKAGES: cake-autorate luci-app-cake-autorate
          IGNORE_ERRORS: 0
      - name: Collect packages
        run: |
          mkdir -p dist
          find bin/packages -type f \( -name 'cake-autorate*.ipk' -o -name 'cake-autorate*.apk' -o -name 'luci-app-cake-autorate*.ipk' -o -name 'luci-app-cake-autorate*.apk' \) -exec cp {} dist/ \;
          ls -l dist
      - uses: actions/upload-artifact@v4
        with:
          name: packages-${{ matrix.version }}
          path: dist/*

  # Only tag runs get contents:write: one job collects every package,
  # computes SHA256SUMS and attaches everything to the release in one step.
  release:
    name: release (packages + SHA256SUMS)
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: packages-*
          merge-multiple: true
          path: dist
      - name: Compute checksums
        working-directory: dist
        run: |
          sha256sum -- * > SHA256SUMS
          cat SHA256SUMS
      - name: Attach packages and SHA256SUMS to release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2 as of 2026-09-30
        with:
          files: dist/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
